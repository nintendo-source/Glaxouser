name: Build Windows EXE and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Electron Main Script
        shell: powershell
        run: |
          if (!(Test-Path -Path "electron")) { New-Item -ItemType Directory -Path "electron" }
          Set-Content -Path "electron/main.js" -Value @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({ width: 1280, height: 800 });
            win.loadFile(path.join(__dirname, '../dist/index.html'));
          }
          app.whenReady().then(createWindow);
          "@

      - name: Build Web Dist
        run: npx vite build

      - name: Build Portable EXE
        run: npx electron-builder --win portable --config.extraMetadata.main=electron/main.js

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable-Browser
          path: dist-electron/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Dist
        run: npx vite build

      - name: Sync Capacitor
        run: |
          npx cap init "Glaxouser" "com.glaxouser.browser" --web-dir "dist"
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Browser
          path: android/app/build/outputs/apk/debug/app-debug.apk
